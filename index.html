<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AndaSP - Descubra São Paulo</title>
    
    <meta name="description" content="Guia inteligente de São Paulo para turistas e moradores.">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Fontes (Inter e Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/design-system.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Navegação Topo (Desktop) -->
    <header class="top-nav-desktop">
        <div class="nav-container">
            <div class="brand">
                Anda<span>SP</span>
            </div>
            <nav class="nav-links">
                <button class="nav-item active" data-route="explorar">Explorar</button>
                <button class="nav-item" data-route="roteiros">Roteiros</button>
                <button class="nav-item" data-route="salvos">Salvos</button>
                <button class="nav-item" data-route="perfil">Perfil</button>
            </nav>
        </div>
    </header>

    <div id="app" class="app-container">
        <!-- O conteúdo das views será injetado aqui -->
        <main id="router-view" class="view-content"></main>
        
        <!-- Bottom Navigation Mobile (Escondida no desktop) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-route="explorar">
                <i data-lucide="compass"></i>
                <span>Explorar</span>
            </button>
            <button class="nav-item" data-route="roteiros">
                <i data-lucide="route"></i>
                <span>Roteiros</span>
            </button>
            <button class="nav-item" data-route="salvos">
                <i data-lucide="bookmark"></i>
                <span>Salvos</span>
            </button>
            <button class="nav-item" data-route="perfil">
                <i data-lucide="user"></i>
                <span>Perfil</span>
            </button>
        </nav>
    </div>

    <!-- Widget de Chat Flutuante (Apenas Visual) -->
    <div class="chat-widget">
        <div class="chat-window" id="chat-window">
            <div class="chat-header">
                <div>
                    <h4 style="margin:0; font-family:'Outfit';">Sté</h4>
                    <span style="font-size:12px; opacity:0.8;">Online agora</span>
                </div>
                <button id="close-chat" class="btn-icon-small"><i data-lucide="x"></i></button>
            </div>
            <div class="chat-body">
                <div class="chat-message agent">Olá! Como posso ajudar a planejar seu passeio por São Paulo hoje?</div>
                <div class="chat-message user">Queria dicas de restaurantes no centro.</div>
                <div class="chat-message agent">Temos ótimas opções! O Mercado Municipal é um clássico imperdível. Posso mostrar outras opções na região?</div>
            </div>
            <div class="chat-footer">
                <input type="text" placeholder="Escreva uma mensagem...">
                <button class="send-btn"><i data-lucide="send"></i></button>
            </div>
        </div>
        <button class="chat-fab" id="chat-fab">
            <i data-lucide="message-square"></i>
        </button>
    </div>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
